## Benchmark Configuration — Postal Systems (paper-direct comparison)
## Replicator gets the raw PDF instead of the extracted methodology summary.

models:
  - provider: anthropic
    model_name: claude-opus-4-6
    api_key_env: ANTHROPIC_API_KEY
    approaches:
      - claude-code-paper

papers:
  - paper_id: postal_systems
    pdf_path: data/input/postal_systems/paper.pdf
    data_path: data/input/postal_systems/data
    replication_package_path: data/input/postal_systems/replication_package

approaches:
  - claude-code-paper

judge:
  provider: openai
  model_name: gpt-5-mini
  use_vision: true

extractor:
  model: gpt-5.2
  use_vision: true

output_dir: data/benchmark_results/postal_systems_paper_direct
opencode_binary: /Users/bkohler/.opencode/bin/opencode
claude_code_binary: claude
codex_binary: codex
timeout_seconds: 3600
allow_web_access: false
