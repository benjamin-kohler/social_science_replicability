## Benchmark Configuration — Postal Systems paper
## Rogowski et al. (2022) "Public Infrastructure and Economic Development"

models:
  ## OpenAI gpt-5.2-codex — structured (LangGraph pipeline)
  - provider: openai
    model_name: gpt-5.2-codex
    api_key_env: OPENAI_API_KEY
    approaches:
      - structured

  ## opencode/gpt-5.2-codex via opencode CLI — freestyle
  - provider: openai
    model_name: gpt-5.2-codex
    api_key_env: OPENAI_API_KEY
    approaches:
      - freestyle

  ## Claude Code CLI — opus 4.6 via claude -p
  - provider: anthropic
    model_name: claude-opus-4-6
    api_key_env: ANTHROPIC_API_KEY
    approaches:
      - claude-code

  ## Codex CLI — gpt-5.3-codex via codex exec
  - provider: openai
    model_name: gpt-5.3-codex
    api_key_env: OPENAI_API_KEY
    approaches:
      - codex

papers:
  - paper_id: postal_systems
    pdf_path: data/input/postal_systems/paper.pdf
    data_path: data/input/postal_systems/data
    replication_package_path: data/input/postal_systems/replication_package

approaches:
  - freestyle
  - structured
  - claude-code
  - codex

judge:
  provider: openai
  model_name: gpt-5-mini

output_dir: data/benchmark_results/postal_systems
opencode_binary: /Users/bkohler/.opencode/bin/opencode
claude_code_binary: claude
codex_binary: codex
timeout_seconds: 3600
allow_web_access: false
